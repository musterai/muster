# Include in NGINX's http context (for example /etc/nginx/conf.d/muster.conf).
# Replace muster.office.example and the upstream address for your installation.
server {
    listen 443 ssl;
    server_name muster.office.example;

    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Match Muster's transport ceiling; NGINX's 1m default rejects valid bodies.
    client_max_body_size 5m;

    # Do not record OAuth authorization codes or device codes in query strings.
    access_log off;

    location / {
        proxy_pass http://muster-server:6878;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host muster.office.example;
        proxy_set_header X-Forwarded-Host muster.office.example;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        # This example is the immediate TLS edge: replace client-supplied values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";

        # SSE and Streamable HTTP MCP need each chunk forwarded immediately.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        # Fail an unavailable backend before a client times out; stream reads
        # below remain long-lived after the upstream connection is established.
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
