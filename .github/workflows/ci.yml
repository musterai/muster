name: MusterAI CI

on:
  push:
    branches: [ main, feat/*, feature/*, rebuild/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the oldest supported maintained LTS line; Node 24 is
        # the newer line used by the production image. Keep both in the
        # release gate so the minimum does not silently drift.
        node-version: [22, 24]

    container:
      image: node:${{ matrix.node-version }}

    # MUS-31: a real Postgres instance alongside SQLite so the suite proves
    # itself against both DatabaseAdapter backends, not just the
    # zero-config default. tests/postgres-adapter.test.ts skips itself
    # (describe.skipIf) unless MUSTER_TEST_PG_URL is set, so this is the
    # only place that env var should be defined.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muster
          POSTGRES_PASSWORD: muster
          POSTGRES_DB: muster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MUSTER_TEST_PG_URL: postgres://muster:muster@postgres:5432/muster_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y build-essential sqlite3 libsqlite3-dev
          else
            apt-get update && apt-get install -y build-essential sqlite3 libsqlite3-dev
          fi

      - name: Install Dependencies
        # The explicit audit gate below checks both runtime and all dependencies.
        run: npm ci --engine-strict --no-audit

      - name: Run Build (Vite SPA + TypeScript)
        run: npm run build

      - name: Verify Frontend Bundle Budget
        run: npm run bundle:check

      - name: Verify Browser E2E Failure Cleanup
        run: npm run test:browser-cleanup

      - name: Run Vitest Suite (SQLite + PostgreSQL)
        run: npm test

      - name: Verify Health Route Unit Test
        run: npx vitest run tests/health.test.ts --passWithNoTests

      # Always obtain test results before a registry outage can fail the audit gate.
      - name: Reject High-Severity Dependency Advisories
        run: |
          audit_with_retries() {
            for audit_attempt in 1 2 3; do
              if "$@" -- --fetch-timeout=30000 --fetch-retries=0; then
                return 0
              fi
              if [ "$audit_attempt" -lt 3 ]; then
                echo "Audit attempt $audit_attempt failed; retrying in 10 seconds."
                sleep 10
              fi
            done
            # Registry errors and advisories above the threshold still fail CI.
            return 1
          }
          audit_with_retries npm run audit:runtime
          audit_with_retries npm run audit

  office-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify supplied TLS certificates and NGINX/Traefik streaming
        run: node scripts/remote-test/proxy-smoke.mjs
      - name: Upload sanitized proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-proxies
          path: scratch/office-proxy-*/report.json
          if-no-files-found: warn

  remote-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify real HTTPS, Keycloak, browsers, and independent MCP clients
        env:
          MUSTER_TEST_BACKEND: ${{ matrix.backend }}
          MUSTER_TEST_CLIENTS: 10
        run: npm run test:remote
      - name: Upload sanitized remote verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-${{ matrix.backend }}
          path: scratch/remote-*/results/report.json
          if-no-files-found: warn
