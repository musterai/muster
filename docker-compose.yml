# docker-compose.yml - Muster
#
# Secure-by-default deployment example. The app listens on all interfaces
# inside the container, but the host publication is loopback-only. Put a
# TLS-terminating reverse proxy on the host/private network in front of it.
# Copy .env.example to .env and provide real OIDC values before starting.

services:
  muster-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muster-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:6878:6878"
    environment:
      - MUSTER_PORT=6878
      - MUSTER_HOST=0.0.0.0
      - MUSTER_AUTH_MODE=enforced
      - MUSTER_DB_PATH=/app/data/muster.db
      - MUSTER_PUBLIC_URL=${MUSTER_PUBLIC_URL:?Set the external HTTPS origin}
      - MUSTER_OIDC_ISSUER=${MUSTER_OIDC_ISSUER:?Set the OIDC issuer URL}
      - MUSTER_OIDC_CLIENT_ID=${MUSTER_OIDC_CLIENT_ID:?Set the OIDC client ID}
      - MUSTER_OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_client_secret
      - MUSTER_BOOTSTRAP_OWNER_SUBJECT=${MUSTER_BOOTSTRAP_OWNER_SUBJECT:?Set the pinned bootstrap owner subject}
      - MUSTER_TRUST_PROXY=127.0.0.1,::1
    volumes:
      - muster-data:/app/data
    secrets:
      - oidc_client_secret
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:6878/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  muster-data:
    driver: local

secrets:
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
